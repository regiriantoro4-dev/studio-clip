<!doctype html>
<html lang="id" data-composition-variables='[
  {"id":"brand","type":"string","label":"Teks utama","default":"KOPLO77"},
  {"id":"tagline","type":"string","label":"Tagline","default":"GAMING HIGHLIGHT"},
  {"id":"pos","type":"string","label":"Posisi di layar","default":"tengah","options":[["atas","Atas"],["tengah","Tengah"],["bawah","Bawah"]]},
  {"id":"size","type":"string","label":"Ukuran teks","default":"100","options":[["80","Kecil"],["100","Normal"],["120","Besar"]]},
  {"id":"c1","type":"color","label":"Warna terang","default":"#FFF4C2"},
  {"id":"c2","type":"color","label":"Warna utama","default":"#E8B23A"},
  {"id":"c3","type":"color","label":"Warna gelap / sisi 3D","default":"#4A2C00"},
  {"id":"glow","type":"color","label":"Cahaya","default":"#FFC83D"}
]'>
<head>
  <meta charset="utf-8" />
  <script src="vendor/gsap.min.js"></script>
  <style>
    html, body { margin: 0; background: transparent; }
    #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
    .center { position: absolute; left: 540px; top: 900px; width: 0; height: 0; }
    .rays { position: absolute; left: -620px; top: -620px; width: 1240px; height: 1240px; border-radius: 50%;
      -webkit-mask: radial-gradient(circle, #000 18%, transparent 68%); mask: radial-gradient(circle, #000 18%, transparent 68%); }
    .ring { position: absolute; left: -200px; top: -200px; width: 400px; height: 400px; border-radius: 50%; border: 14px solid; }
    .flash { position: absolute; left: -540px; top: -540px; width: 1080px; height: 1080px; border-radius: 50%; }
    .p { position: absolute; width: 16px; height: 16px; margin: -8px; border-radius: 50%; }
    .logo { position: absolute; left: -540px; top: -130px; width: 1080px; text-align: center; white-space: nowrap; }
    .ch { display: inline-block; font: 900 190px/1 "BrandFont", serif; position: relative;
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; -webkit-text-stroke: 4px; }
    .shine { position: absolute; left: 0; top: 0; width: 1080px; text-align: center; white-space: nowrap; pointer-events: none;
      font: 900 190px/1 "BrandFont", serif;
      background: linear-gradient(105deg, transparent 0%, transparent 42%, rgba(255,255,255,.95) 50%, transparent 58%, transparent 100%);
      background-size: 300% 100%; background-position: 120% 0;
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    .tag { position: absolute; left: -540px; top: 110px; width: 1080px; text-align: center;
      font: 400 52px/1 "TagFont", sans-serif; color: #fff; letter-spacing: 16px; white-space: nowrap; }
    .bar { position: absolute; top: 92px; height: 8px; width: 520px; left: -260px; border-radius: 4px; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="bumper" data-start="0" data-duration="2.6" data-width="1080" data-height="1920" data-fps="30">
    <div class="center" id="center">
      <div class="rays" id="rays"></div>
      <div class="flash" id="flash"></div>
      <div class="ring" id="ring"></div>
      <div id="parts"></div>
      <div class="logo" id="logo"><div class="shine" id="shine"></div></div>
      <div class="bar" id="bar"></div>
      <div class="tag" id="tag"></div>
    </div>
  </div>
  <script>
    const V = (window.__hyperframes && window.__hyperframes.getVariables()) || {}
    const S = Math.max(0.6, Math.min(1.4, (parseFloat(V.size) || 100) / 100))
    document.getElementById('center').style.top = (V.pos === 'atas' ? 540 : V.pos === 'bawah' ? 1300 : 900) + 'px'
    const brand = String(V.brand || 'KOPLO77').toUpperCase()
    const c1 = V.c1 || '#FFF4C2', c2 = V.c2 || '#E8B23A', c3 = V.c3 || '#4A2C00', glow = V.glow || '#FFC83D'
    const hexA = (h, a) => { const n = parseInt(String(h).slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})` }

    document.getElementById('rays').style.background = `repeating-conic-gradient(from 0deg, ${hexA(glow, .34)} 0deg 6deg, ${hexA(glow, 0)} 6deg 18deg)`
    const ring = document.getElementById('ring'); ring.style.borderColor = c1; ring.style.boxShadow = `0 0 40px ${glow}, inset 0 0 30px ${glow}`
    document.getElementById('flash').style.background = `radial-gradient(circle, rgba(255,252,235,.95), ${hexA(glow, 0)} 60%)`
    document.getElementById('bar').style.background = `linear-gradient(90deg, transparent, ${c2}, transparent)`
    const tag = document.getElementById('tag'); tag.textContent = String(V.tagline || '').toUpperCase()
    tag.style.textShadow = `0 4px 0 #000, 0 0 24px ${hexA(glow, .8)}`

    const logo = document.getElementById('logo'), shine = document.getElementById('shine')
    for (const ch of brand) {
      const s = document.createElement('span'); s.className = 'ch'; s.textContent = ch === ' ' ? ' ' : ch
      s.style.background = `linear-gradient(180deg, ${c1} 0%, ${c2} 38%, #FFFFFF 48%, ${c3} 58%, ${c2} 80%, ${c3} 100%)`
      s.style.webkitBackgroundClip = 'text'; s.style.webkitTextStrokeColor = c3
      s.style.filter = `drop-shadow(0 6px 0 ${c3}) drop-shadow(0 12px 0 rgba(0,0,0,.55)) drop-shadow(0 22px 26px rgba(0,0,0,.65))`
      logo.insertBefore(s, shine)
    }
    shine.textContent = brand
    const parts = document.getElementById('parts'), N = 28
    for (let i = 0; i < N; i++) { const d = document.createElement('div'); d.className = 'p'; d.style.background = `radial-gradient(circle, #FFFBE6, ${glow} 60%, ${hexA(glow, 0)} 70%)`; parts.appendChild(d) }

    function fit() {  // teks utama & tagline dikecilkan agar muat 960 px
      document.querySelectorAll('.ch').forEach((e) => { e.style.fontSize = 190 * S + 'px' }); shine.style.fontSize = 190 * S + 'px'; tag.style.fontSize = 52 * S + 'px'
      const w = logo.scrollWidth
      const k = Math.min(1, 960 / Math.max(1, Array.from(document.querySelectorAll('.ch')).reduce((s, e) => s + e.offsetWidth, 0)))
      if (k < 1) { document.querySelectorAll('.ch').forEach((e) => { e.style.fontSize = 190 * S * k + 'px' }); shine.style.fontSize = 190 * S * k + 'px' }
      const kt = Math.min(1, 980 / Math.max(1, tag.scrollWidth))
      tag.style.fontSize = 52 * S * kt + 'px'
      return w
    }

    function build() {
      fit()
      const tl = gsap.timeline({ paused: true })
      const chars = gsap.utils.toArray('.ch')
      tl.fromTo('#flash', { scale: 0.2, opacity: 0 }, { scale: 1.3, opacity: 1, duration: 0.18, ease: 'power2.out' }, 0)
        .to('#flash', { opacity: 0, scale: 1.6, duration: 0.5, ease: 'power2.in' }, 0.18)
        .fromTo('#ring', { scale: 0.1, opacity: 1 }, { scale: 3.2, opacity: 0, duration: 0.8, ease: 'expo.out' }, 0.05)
        .fromTo('#rays', { opacity: 0, rotation: -20, scale: 0.6 }, { opacity: 1, rotation: 30, scale: 1, duration: 2.6, ease: 'none' }, 0)
      gsap.utils.toArray('.p').forEach((el, i) => {
        const a = (i / N) * Math.PI * 2 + (i % 3) * 0.17, r = 380 + (i % 5) * 70
        tl.fromTo(el, { x: 0, y: 0, scale: 1.4, opacity: 1 },
          { x: Math.cos(a) * r, y: Math.sin(a) * r * 0.85, scale: 0.2, opacity: 0, duration: 1.1 + (i % 4) * 0.12, ease: 'power3.out' }, 0.08)
      })
      tl.fromTo(chars, { y: -260, rotation: (i) => (i % 2 ? 22 : -22), scale: 1.6, opacity: 0 },
        { y: 0, rotation: 0, scale: 1, opacity: 1, duration: 0.55, ease: 'back.out(2.2)', stagger: Math.min(0.07, 0.6 / chars.length) }, 0.12)
        .fromTo('#logo', { scale: 1 }, { scale: 1.06, duration: 0.14, yoyo: true, repeat: 1, ease: 'power1.inOut' }, 0.85)
        .fromTo('#shine', { backgroundPosition: '120% 0' }, { backgroundPosition: '-20% 0', duration: 0.7, ease: 'power2.inOut' }, 0.95)
        .fromTo('#bar', { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.4, ease: 'power3.out' }, 0.85)
        .fromTo('#tag', { y: 40, opacity: 0, scale: 1.15 }, { y: 0, opacity: 1, scale: 1, duration: 0.5, ease: 'power3.out' }, 0.95)
        .to('#center', { scale: 1.25, opacity: 0, duration: 0.35, ease: 'power2.in' }, 2.22)
      window.__timelines = window.__timelines || {}
      window.__timelines.bumper = tl
    }
    const f1 = new FontFace('BrandFont', 'url(fonts/brand.ttf)'), f2 = new FontFace('TagFont', 'url(fonts/tag.ttf)')
    Promise.all([f1.load(), f2.load()]).then((fs) => { fs.forEach((f) => document.fonts.add(f)); build() }, build)
  </script>
</body>
</html>
